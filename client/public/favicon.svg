    @media (prefers-color-scheme: dark) {
      .bg { fill: #ea580c; }
      .fg { stroke: #0f0f12; fill: #0f0f12; }
      .fg-stroke { stroke: #0f0f12; }
    }
  </style>
  <rect width="32" height="32" rx="16" class="bg" />
  <g class="fg" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="8" fill="none" class="fg-stroke" />
    <circle cx="16" cy="16" r="2.8" />
    <line x1="16" y1="3.5" x2="16" y2="28.5" class="fg-stroke" />
    <line x1="3.5" y1="16" x2="28.5" y2="16" class="fg-stroke" />
    <line x1="7.16" y1="7.16" x2="24.84" y2="24.84" class="fg-stroke" />
    <line x1="7.16" y1="24.84" x2="24.84" y2="7.16" class="fg-stroke" />
  </g>
</svg>
